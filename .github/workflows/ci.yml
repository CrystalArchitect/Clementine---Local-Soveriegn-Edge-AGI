name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  python-syntax:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax-check Python sources
        run: python -m compileall -q clementine crystalcore-app

  python-tests:
    name: Offline test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The suite is offline — it makes no network calls — but the package
      # imports requests at module scope (companion, ollama, spacexai,
      # status), so the dependencies must be present for the import to
      # succeed at all.
      - name: Install dependencies
        working-directory: crystalcore-app
        run: python -m pip install -r requirements.txt
      # GOVERNANCE.md promises every change "passes the offline test suite
      # before merging". Until now CI only ran compileall, so the suite was
      # never executed here — and it was failing.
      - name: Run the offline test suite
        working-directory: crystalcore-app
        run: python -m unittest discover -s tests -v

  web-checks:
    name: SvelteKit check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: svelte-check
        run: npm run check
      - name: Build
        run: npm run build
